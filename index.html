<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Sudoku</title>
  <meta name="description" content="Offline Sudoku with four board sizes and five difficulty levels.">
  <meta name="theme-color" content="#f4f1ea" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#16181d" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Sudoku">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <h1>Sudoku</h1>
      <div class="topbar-actions">
        <button class="icon-btn" id="btn-stats" aria-label="Statistics" title="Statistics">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V11M12 20V4M19 20v-6"/></svg>
        </button>
        <button class="icon-btn" id="btn-settings" aria-label="Settings" title="Settings">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
        </button>
        <button class="btn primary" id="btn-new">New game</button>
      </div>
    </header>

    <section class="status" aria-live="polite">
      <span id="game-label">—</span>
      <span class="status-right">
        <span id="mistakes" title="Mistakes">Mistakes 0</span>
        <button class="timer" id="btn-pause" aria-label="Pause">
          <span id="timer">0:00</span>
          <svg viewBox="0 0 24 24" aria-hidden="true" class="pause-icon"><path d="M9 6v12M15 6v12"/></svg>
        </button>
      </span>
    </section>

    <section class="board-wrap">
      <div class="board" id="board" role="grid" aria-label="Sudoku board"></div>
      <div class="overlay hidden" id="overlay">
        <div class="overlay-card">
          <p id="overlay-text">Paused</p>
          <button class="btn primary" id="btn-resume">Resume</button>
        </div>
      </div>
    </section>

    <section class="tools">
      <button class="tool" id="btn-undo">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
        <span>Undo</span>
      </button>
      <button class="tool" id="btn-erase">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 20H8l-5-5 10-10 8 8-7 7"/><path d="m6 12 6 6"/></svg>
        <span>Erase</span>
      </button>
      <button class="tool" id="btn-notes" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
        <span>Notes <b id="notes-state">off</b></span>
      </button>
      <button class="tool" id="btn-hint">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18h6M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.3 1 2.3h6c0-1 .4-1.8 1-2.3A7 7 0 0 0 12 2z"/></svg>
        <span>Hint</span>
      </button>
    </section>

    <section class="pad" id="pad" aria-label="Number pad"></section>
  </main>

  <dialog id="dlg-new">
    <form method="dialog" class="dialog-body">
      <h2>New game</h2>
      <fieldset>
        <legend>Size</legend>
        <div class="choices" id="size-choices"></div>
      </fieldset>
      <fieldset>
        <legend>Difficulty</legend>
        <div class="choices" id="difficulty-choices"></div>
      </fieldset>
      <div class="dialog-actions">
        <button class="btn" value="cancel" id="btn-new-cancel">Cancel</button>
        <button class="btn primary" value="start" id="btn-new-start">Start</button>
      </div>
    </form>
  </dialog>

  <dialog id="dlg-settings">
    <form method="dialog" class="dialog-body">
      <h2>Settings</h2>
      <label class="switch"><input type="checkbox" id="set-mistakes"> <span>Show mistakes immediately</span></label>
      <label class="switch"><input type="checkbox" id="set-highlight"> <span>Highlight matching numbers</span></label>
      <label class="switch"><input type="checkbox" id="set-autonotes"> <span>Remove notes automatically</span></label>
      <label class="switch"><input type="checkbox" id="set-hidecomplete"> <span>Dim numbers that are used up</span></label>
      <label class="switch"><input type="checkbox" id="set-timer"> <span>Show timer</span></label>
      <label class="theme-row">Theme
        <select id="set-theme">
          <option value="auto">Match device</option>
          <option value="light">Light</option>
          <option value="dark">Dark</option>
        </select>
      </label>
      <p class="fineprint" id="offline-status"></p>
      <div class="dialog-actions">
        <button class="btn primary" value="close">Done</button>
      </div>
    </form>
  </dialog>

  <dialog id="dlg-stats">
    <form method="dialog" class="dialog-body">
      <h2>Statistics</h2>
      <div class="stats-scroll"><table class="stats" id="stats-table"></table></div>
      <div class="dialog-actions">
        <button class="btn" value="reset" id="btn-reset-stats">Reset</button>
        <button class="btn primary" value="close">Done</button>
      </div>
    </form>
  </dialog>

  <dialog id="dlg-win">
    <form method="dialog" class="dialog-body center">
      <h2>Solved!</h2>
      <p id="win-text"></p>
      <div class="dialog-actions">
        <button class="btn" value="close">Close</button>
        <button class="btn primary" value="new" id="btn-win-new">New game</button>
      </div>
    </form>
  </dialog>

  <script src="sudoku.js"></script>
  <script src="app.js"></script>
</body>
</html>
